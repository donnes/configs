# macOS-only mise tools, linked to ~/.config/mise/conf.d/donnes-macos.toml.
# Omarchy installs these agent CLIs into its own config.toml, and their
# ~/.local/bin wrappers run `mise use -g <tool>`, which refuses a tool that two
# global config files declare. So they can't be in the shared fragment.

[tools]
claude = "latest"
codex = "latest"
# The aqua backend installs the release binary, without Node. Its "latest"
# still resolves to the 1.x line, so pin v2.
"aqua:anomalyco/opencode" = "2"
cursor-agent = { version = "latest", bin_path = "bin", strip_components = "0", url = 'https://downloads.cursor.com/lab/{{ version }}/{{ os(macos="darwin") }}/{{ arch(arm64="arm64", x64="x64") }}/agent-cli-package.tar.gz', version_list_url = "https://cursor.com/install", version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/', postinstall = 'mkdir -p "$MISE_TOOL_INSTALL_PATH/bin" && ln -sfn ../dist-package/cursor-agent "$MISE_TOOL_INSTALL_PATH/bin/cursor-agent"' }

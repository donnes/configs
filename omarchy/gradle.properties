# Overrides each project's gradle.properties for local builds; -P still wins.
# EAS and CI builds don't read this file.

# x86_64 emulators only need x86_64. `expo run:android` already
# builds the connected device's ABI; this covers release and direct gradlew builds,
# which otherwise compile every native module for four ABIs.
reactNativeArchitectures=x86_64

# Worktrees start from new paths, so incremental builds never carry over.
# The build cache lets them reuse Java and Kotlin outputs.
org.gradle.caching=true

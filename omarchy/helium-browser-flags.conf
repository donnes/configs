# Read by Helium's launcher (/usr/bin/helium-browser) at startup.
# Run WebGPU on the GPU through Vulkan. Without the Vulkan feature, WebGPU
# falls back to software (SwiftShader). Since Chromium 157, WebGPU needs no
# --enable-unsafe-webgpu here; that flag only added an "unsupported
# command-line flag" warning bar. Vulkan alone composites every <video> frame
# as white, so VulkanFromANGLE and DefaultANGLEVulkan route Vulkan through
# ANGLE, which renders video correctly and keeps the hardware WebGPU adapter.
--enable-features=Vulkan,VulkanFromANGLE,DefaultANGLEVulkan
--use-angle=vulkan

# Read by Helium's launcher (/usr/bin/helium-browser) at startup.
# Chromium keeps WebGPU off on Linux. These turn it on and run it on the GPU
# through Vulkan. Without the Vulkan feature, WebGPU falls back to software
# (SwiftShader). Vulkan alone composites every <video> frame as white, so
# VulkanFromANGLE and DefaultANGLEVulkan route Vulkan through ANGLE, which
# renders video correctly and keeps the hardware WebGPU adapter.
--enable-unsafe-webgpu
--enable-features=Vulkan,VulkanFromANGLE,DefaultANGLEVulkan
--use-angle=vulkan

[bar]
background       = "#1c1c1e"
background-alpha = 0.78
text             = "#e1ebf7"
active           = "#fa6d80"
scale-with-font  = true
size-horizontal  = 28
size-vertical    = 34
icon-slot        = 21

[hyprland]
active-border            = "#cba6f7"
active-border-foreground = "#e1ebf7"

[controls]
normal-color        = "#e1ebf7"
normal-fill-alpha   = 0.05
normal-border       = "#e1ebf7"
normal-border-width = 0
normal-border-alpha = 0.0

hover-cursor-color        = "#e1ebf7"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#e1ebf7"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0.0

focus-color        = "#cba6f7"
focus-fill-alpha   = 0.08
focus-border       = "#cba6f7"
focus-border-width = 1
focus-border-alpha = 0.7

selected-color        = "#e1ebf7"
selected-fill-alpha   = 0.12
selected-border       = "#e1ebf7"
selected-border-width = 0
selected-border-alpha = 0.0

pressed-fill-alpha   = 0.16
selection-fill-alpha = 0.35

[spacing]
scale = 1.15
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#1c1c1e"
background-alpha = 0.88
text             = "#e1ebf7"
border           = "#e1ebf7"
border-alpha     = 0.1
border-width     = 1

[tooltip]

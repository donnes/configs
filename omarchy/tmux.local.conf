# Personal deltas layered after Omarchy's tmux config.
set -g prefix C-s
bind -N "Send prefix" C-s send-prefix
unbind r
bind -N "Reload configuration" r source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind V split-window -f -v -p 20 -c "#{pane_current_path}"
bind C-x kill-window
bind C-S-x kill-session
bind d new-window -c "#{pane_current_path}" -n "dev" \; send-keys "nv" C-m \; split-window -h -p 30 -c "#{pane_current_path}" \; send-keys "opencode" C-m \; split-window -f -v -p 20 -c "#{pane_current_path}" \; select-pane -t 1 \; swap-window -t 1 \; select-window -t 1
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
set -g status-left "#[fg=black,bg=gray,bold] #S #[bg=default] "
set -g status-right "#[fg=gray]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-current-format "#[fg=gray,bold] #I:#W "
set -g pane-active-border-style "fg=gray"
set -g message-style "bg=default,fg=gray"
set -g message-command-style "bg=default,fg=gray"
set -g mode-style "bg=gray,fg=black"
setw -g clock-mode-colour gray
